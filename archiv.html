<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Archiv — Lichtblick</title>
<meta name="description" content="Alle bisherigen Lichtblicke im Überblick: eine wachsende Sammlung verifizierter, positiver Nachrichten aus allen Lebensbereichen." />
<link rel="preconnect" href="https://api.fontshare.com" />
<link href="https://api.fontshare.com/v2/css?f[]=zodiak@400,500,600&f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./base.css?v=202610310912" />
<link rel="stylesheet" href="./style.css?v=202610310912" />
</head>
<body>

<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="brand" href="./index.html" aria-label="Lichtblick — Startseite">
      <svg class="brand__mark" viewBox="0 0 40 40" fill="none" aria-hidden="true">
        <circle cx="20" cy="24" r="9" fill="currentColor"/>
        <path d="M20 2v5M20 2l-3.5 4M20 2l3.5 4" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M6 24h3M31 24h3M9.5 12.5l2.2 2.2M28.5 12.5l-2.2 2.2" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
      </svg>
      <span class="brand__name">Lichtblick</span>
    </a>
    <nav class="nav" aria-label="Hauptnavigation">
      <a href="./index.html"><span class="nav-label">Heute</span></a>
      <a href="./archiv.html" aria-current="page"><span class="nav-label">Archiv</span></a>
      <button class="theme-toggle" data-theme-toggle aria-label="Farbmodus wechseln"></button>
    </nav>
  </div>
</header>

<main>
  <section class="page-header wrap wrap--narrow">
    <h1>Das Archiv der guten Nachrichten</h1>
    <p>Jeder Tag hinterlässt einen Lichtblick. Hier sammeln sich alle bisherigen Ausgaben — durchsuchbar nach Themen.</p>
    <div class="filters" id="filters" role="group" aria-label="Nach Kategorie filtern"></div>
    <div class="sort-row">
      <label class="sort-row__label" for="sort-select">Sortierung</label>
      <select id="sort-select" class="sort-select" aria-label="Archiv sortieren"></select>
    </div>
  </section>

  <section class="wrap" id="archive-section">
    <div class="archive-grid" id="archive-grid"></div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <p>© <span id="year"></span> Lichtblick · Automatisch kuratiert, jeden Tag neu.</p>
    <span class="visit-counter" data-visit-counter hidden></span>
    <nav>
      <a href="./index.html">Heute</a>
      <a href="./archiv.html">Archiv</a>
    </nav>
  </div>
</footer>

<script src="./app.js?v=202610310912"></script>
<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  let ALL_ITEMS = [];
  let activeFilter = 'alle';
  let activeSort = 'chrono';

  function rankBadge(rank) {
    if (!rank) return '';
    return `<span class="rank-badge">#${rank}</span>`;
  }

  function likesHtml(item) {
    if (!VOTES_CACHE) return '';
    const n = upCount(VOTES_CACHE, item.date);
    return n ? ` · <span class="archive-likes">👍 ${formatCount(n)}</span>` : '';
  }

  function cardTemplate(item, rank) {
    const icon = CATEGORY_ICONS[item.category_key] || CATEGORY_ICONS.gesellschaft;
    const label = escapeHtml(item.category || CATEGORY_LABELS[item.category_key] || '');
    return `
      <article class="archive-card">
        <div class="archive-card__visual" style="--cat-color:${catColor(item.category_key)}">${icon}${rankBadge(rank)}</div>
        <div class="archive-card__body">
          <span class="archive-card__date">${escapeHtml(formatDateShort(item.date))} · ${label}</span>
          <h3>${escapeHtml(item.headline)}</h3>
          <p>${escapeHtml(item.summary)}</p>
          <div class="archive-card__footer">
            <span class="source-line">${escapeHtml(item.source_name)}${likesHtml(item)}</span>
            <div class="archive-card__actions">
              ${shareButtonHtml(item.headline, './archiv.html', true)}
              <a href="${safeUrl(item.source_url)}" target="_blank" rel="noopener noreferrer">Original lesen →</a>
            </div>
          </div>
        </div>
      </article>`;
  }

  function renderFilters(items) {
    const keys = Array.from(new Set(items.map((i) => i.category_key)));
    const wrap = document.getElementById('filters');
    const all = document.createElement('button');
    all.className = 'filter-chip';
    all.textContent = 'Alle';
    all.setAttribute('aria-pressed', 'true');
    all.addEventListener('click', () => setFilter('alle'));
    wrap.appendChild(all);
    keys.forEach((k) => {
      const btn = document.createElement('button');
      btn.className = 'filter-chip';
      btn.textContent = CATEGORY_LABELS[k] || k;
      btn.dataset.key = k;
      btn.setAttribute('aria-pressed', 'false');
      btn.addEventListener('click', () => setFilter(k));
      wrap.appendChild(btn);
    });
  }

  function setFilter(key) {
    activeFilter = key;
    document.querySelectorAll('.filter-chip').forEach((b) => {
      const isActive = (key === 'alle' && b.textContent === 'Alle') || b.dataset.key === key;
      b.setAttribute('aria-pressed', String(isActive));
    });
    renderGrid();
  }

  function renderSortOptions(items) {
    const select = document.getElementById('sort-select');
    const years = Array.from(new Set(items.map((i) => (i.date || '').slice(0, 4)).filter(Boolean))).sort().reverse();
    const opts = [
      { value: 'chrono', label: 'Neueste zuerst' },
      { value: 'oldest', label: 'Älteste zuerst' },
    ];
    if (votesEnabled()) {
      opts.push({ value: 'top', label: 'Beliebteste zuerst' });
      years.forEach((y) => opts.push({ value: `top5:${y}`, label: `Top 5 des Jahres ${y}` }));
    }
    select.innerHTML = opts.map((o) => `<option value="${o.value}">${escapeHtml(o.label)}</option>`).join('');
    select.value = activeSort;
    select.addEventListener('change', () => {
      activeSort = select.value;
      renderGrid();
    });
  }

  // Sortiert nach Beliebtheit: Daumen hoch minus Daumen runter,
  // bei Gleichstand mehr Daumen hoch, dann neuere zuerst.
  function byPopularity(votes) {
    return (a, b) =>
      netScore(votes, b.date) - netScore(votes, a.date) ||
      upCount(votes, b.date) - upCount(votes, a.date) ||
      (a.date < b.date ? 1 : -1);
  }

  async function getDisplayItems() {
    const items = ALL_ITEMS.slice().sort((a, b) => (a.date < b.date ? 1 : -1));
    if (activeSort === 'oldest') return items.reverse();
    if (activeSort === 'top') {
      const votes = await fetchAllVotes();
      return items.sort(byPopularity(votes));
    }
    if (activeSort.startsWith('top5:')) {
      const year = activeSort.split(':')[1];
      const votes = await fetchAllVotes();
      return items
        .filter((i) => (i.date || '').startsWith(year) && upCount(votes, i.date) > 0)
        .sort(byPopularity(votes))
        .slice(0, 5);
    }
    return items;
  }

  async function renderGrid() {
    const grid = document.getElementById('archive-grid');
    let items = await getDisplayItems();
    const isRanked = activeSort === 'top' || activeSort.startsWith('top5:');
    if (activeFilter !== 'alle') items = items.filter((i) => i.category_key === activeFilter);
    if (items.length === 0) {
      const emptyMsg = activeSort.startsWith('top5:')
        ? 'Für dieses Jahr liegen noch keine Bewertungen vor.'
        : 'Noch keine Einträge in dieser Kategorie.';
      grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="4.5" rx="1"/><path d="M4.5 8.5V19a1.5 1.5 0 0 0 1.5 1.5h12A1.5 1.5 0 0 0 19.5 19V8.5"/></svg>
        <p>${escapeHtml(emptyMsg)}</p>
      </div>`;
      return;
    }
    grid.innerHTML = items.map((item, idx) => cardTemplate(item, isRanked ? idx + 1 : null)).join('');
    initShareButtons(grid);
  }

  loadNews().then((data) => {
    ALL_ITEMS = [data.current, ...(data.archive || [])].filter(Boolean)
      .sort((a, b) => (a.date < b.date ? 1 : -1));
    renderFilters(ALL_ITEMS);
    renderSortOptions(ALL_ITEMS);
    renderGrid();
    if (votesEnabled()) fetchAllVotes().then(() => renderGrid());
  }).catch((e) => {
    document.getElementById('archive-grid').innerHTML =
      '<div class="empty-state" style="grid-column:1/-1"><p>Das Archiv konnte nicht geladen werden.</p></div>';
    console.error(e);
  });
</script>
</body>
</html>
