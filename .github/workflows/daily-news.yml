name: Seite veröffentlichen

# Jede Änderung auf main (z. B. die tägliche neue Nachricht in data/news.json)
# wird automatisch auf GitHub Pages veröffentlicht.
# Manuell starten: Actions → "Seite veröffentlichen" → "Run workflow".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Upload und Deploy laufen in getrennten Jobs. Im selben Job findet
  # deploy-pages das gerade hochgeladene Artefakt manchmal nicht
  # ("No artifacts named github-pages"), siehe actions/deploy-pages#451.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
